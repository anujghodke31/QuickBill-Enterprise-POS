# Local development: `npm run db:up` starts only Postgres.
# Full stack in containers: `docker compose --profile full up --build`.
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: quickbill
      POSTGRES_PASSWORD: quickbill
      POSTGRES_DB: quickbill
    ports:
      - '5432:5432'
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U quickbill -d quickbill']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    profiles: [full]
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://quickbill:quickbill@db:5432/quickbill
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change-me-access-secret-at-least-32-chars}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me-refresh-secret-at-least-32-chars}
      APP_ORIGIN: http://localhost:3000
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - '3000:3000'
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pg_data:
