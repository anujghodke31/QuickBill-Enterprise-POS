name: CI

on:
  push:
    branches: [main, revamp]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test and build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: quickbill
          POSTGRES_PASSWORD: quickbill
          POSTGRES_DB: quickbill
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U quickbill -d quickbill"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://quickbill:quickbill@localhost:5432/quickbill_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: verify
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: quickbill
          POSTGRES_PASSWORD: quickbill
          POSTGRES_DB: quickbill
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U quickbill -d quickbill"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql://quickbill:quickbill@localhost:5432/quickbill
      JWT_ACCESS_SECRET: ci-only-access-secret-0123456789abcdef
      JWT_REFRESH_SECRET: ci-only-refresh-secret-0123456789abcdef
      APP_ORIGIN: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/cache@v4
        with:
          path: apps/api/.cache
          key: embedding-model-v1
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm run db:deploy
      - run: npm run db:seed
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: quickbill:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
