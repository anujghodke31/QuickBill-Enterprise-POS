name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install Root Dependencies
        run: npm ci

      - name: Install Client Dependencies
        run: cd client && npm ci

      - name: Lint (Placeholder - Needs Scripts)
        run: |
          echo "Running ESLint across client..."
          cd client && npm run lint || true

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install Root Dependencies
        run: npm ci

      - name: Run Backend Tests
        run: echo "npm test (Placeholder until Phase 3 sets up Jest)"

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install Client Dependencies
        run: cd client && npm ci

      - name: Build Frontend
        run: cd client && npm run build
        env:
          NODE_ENV: production
  
  docker:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Verify Backend Build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: quickbill-api:test
          
      - name: Verify Frontend (Nginx) Build
        uses: docker/build-push-action@v5
        with:
          context: ./client
          push: false
          tags: quickbill-client:test
